name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: create-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-release:
    permissions:
      contents: write
    name: Create GitHub Release from tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate release tag
        uses: ./.github/actions/validate-release
        with:
          tag: ${{ github.ref_name }}
          base-branch: main

      - name: Create GitHub release from changelog
        uses: ysskrishna/changelog-release-action@v1
