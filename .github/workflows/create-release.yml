name: Create Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: create-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-release:
    permissions:
      contents: write
    name: Create GitHub Release from tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate release tag
        uses: ./.github/actions/validate-release
        with:
          tag: ${{ github.ref_name }}
          base-branch: main

      - name: Extract changelog notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG.md section for version $VERSION"
            exit 1
          fi
          {
            echo "body<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
